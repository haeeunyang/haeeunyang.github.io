      - name: Camera Pose Regression with Deep Learning
        summary: Deep Learning course, Sookmyung Women's University
        date: 2024-06
        period: Mar–Jun 2024
        highlights:
          - Built an image dataset from indoor video and compared four deep learning architectures (CNN, Transformer, ViT, autoencoder) for pose estimation.
        details: >-
          Team project (3 members). We built a camera-pose dataset from 2,646 frames of a 7-minute indoor video,
          reconstructing the floor in RealityCapture with 28 control points (2,580 aligned images), removing noisy
          poses with DBSCAN, and converting Euler angles to quaternions. Using a PoseNet-style loss (position MSE plus
          a β-weighted, normalized quaternion term, with β adjusted each epoch), we compared ResNet50, a transformer
          head on ResNet50 features, a pretrained Vision Transformer, and ResNet50 with an autoencoder. The autoencoder
          model trained most stably; after 100 epochs, its predictions on held-out test images followed the true
          camera path.
        figures:
          - src: /assets/img/projects/camera-pose-3d-map.jpg
            caption: 3D reconstruction of the floor from the video frames (RealityCapture).
            alt: Point-cloud reconstruction of an indoor floor with the camera path and numbered control points.
          - src: /assets/img/projects/camera-pose-test-predictions.png
            caption: "Final model (ResNet50 + autoencoder): predicted vs. true camera positions on test images."
            alt: Scatter plot of true and predicted x-y camera positions for test images; predictions lie close to the labels along the path.
        links:
