        image: /assets/img/projects/rag-architecture.svg
        image_caption: System overview — documents are indexed for semantic and keyword search; each answer is generated by an LLM, checked for numeric grounding and sensitive terms, and returned with its sources.
        image_alt: "System overview: documents are indexed with hybrid vector and keyword search; questions are answered by an LLM, checked for numeric grounding and sensitive terms, and returned with cited sources."
