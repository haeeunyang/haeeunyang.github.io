    Projects:
      - name: Hybrid Retrieval for a Bilingual RAG Chatbot
        summary: Industry–Academia Project, IT and Business Innovation, Sookmyung Women's University
        date: 2026-11
        period: Fall 2026
        image: /assets/img/projects/rag-architecture.svg
        detail_label: View system overview
        image_caption: "System overview: for each question, relevant passages are (1) retrieved from the indexed documents with hybrid vector and keyword search, (2) added to the prompt with the question, and (3) used by the LLM to generate an answer, which is checked for numeric grounding and sensitive terms and returned with its sources."
        image_alt: "Retrieval-augmented generation diagram. Documents are chunked and embedded into a knowledge base with vector and keyword indexes. A question goes to hybrid search, which returns the top-k passages; the question and the passages form one prompt; an LLM with a calculation tool generates the answer, returned with cited sources after numeric and sensitive-term checks."
        highlights:
          - Built hybrid retrieval (multilingual embeddings + BM25, weighted rank fusion) for a Korean–English chatbot on power-plant engineering literature.
          - Evaluated embedding models and rerankers; retrieval gains overstated answer-quality gains.
          - Mentored and taught student teams.

      - name: Camera Pose Regression with Deep Learning
        summary: Deep Learning course, Sookmyung Women's University
        date: 2024-06
        period: Spring 2024
        highlights:
          - Built an image dataset from indoor video and compared four deep learning architectures (CNN, Transformer, ViT, encoder bottleneck) for pose estimation.
        details: >-
          Team project (3 members). We built a camera-pose dataset from 2,646 frames of a 7-minute indoor video,
          reconstructing the floor in RealityCapture with 28 control points (2,580 aligned images), removing noisy
          poses with DBSCAN, and converting Euler angles to quaternions. Each model takes a single frame and regresses
          the camera's position and orientation (a quaternion), trained with a PoseNet-style loss (position MSE plus a
          β-weighted, normalized quaternion term). We compared four architectures: ResNet50 with a linear head,
          ResNet50 features with Transformer encoders, a Vision Transformer (ViT-B/16), and ResNet50 features
          compressed by an encoder bottleneck (2048 → 128).
        figures:
          - src: /assets/img/projects/camera-pose-3d-map.jpg
            caption: 3D reconstruction of the floor from the video frames (RealityCapture), used to label each frame's camera pose.
            alt: Point-cloud reconstruction of an indoor floor with the camera path and numbered control points.
            wide: true
          - src: /assets/img/projects/camera-pose-architecture.svg
            caption: The four models compared. Each maps one video frame to the camera's position and orientation.
            alt: "Diagram of four models that map a 224 by 224 video frame to camera position (x, y, z) and orientation quaternion (w, x, y, z): ResNet50 with a linear head; ResNet50 with two Transformer encoders; a Vision Transformer (ViT-B/16) with linear heads; and ResNet50 with an encoder bottleneck from 2048 to 128 and a regressor. All use position MSE plus a beta-weighted quaternion error."
            wide: true
        links:
          - label: Code
            url: https://github.com/24-1-DL/posereg_team2/blob/main/fin.ipynb

      - name: Course–Career Mapping via Data Visualization
        summary: SM-Data Competition, Sookmyung Women's University · Excellence Prize
        date: 2024-05
        period: Spring 2024
        highlights:
          - Built a word-cloud system linking coursework to employment outcomes.
        details: >-
          Using the university's curriculum data (2020–2023) and graduate employment data (2016–2021), the project
          linked each course to the major competencies listed in the curriculum, extracted the nouns from those
          competency descriptions with KoNLPy, and turned the competencies of the courses a graduate took into a word
          cloud. Given a student ID, the tool draws that graduate's word cloud, so one can see at a glance how their
          coursework relates to the job they took.
        figures:
          - src: /assets/img/projects/course-career-wordcloud-it.png
            caption: "Graduate in AI engineering, hired in information and communications: software, development, systems, data (keywords in Korean)."
            alt: Korean word cloud dominated by words meaning ability, development, application, software, system and data.
          - src: /assets/img/projects/course-career-wordcloud-finance.png
            caption: "Graduate in German language and culture, hired in finance: financial statements, firms, analysis alongside language and culture (keywords in Korean)."
            alt: Korean word cloud with words meaning communication, German, culture, analysis, financial statements and firm.
        links:
          - label: Code
            url: https://github.com/haeeeeuni/sm_data/blob/main/sm_data_SNOWBALL.ipynb

