<title id="t">Shopping-app usage in the 12 hours after OTT use and after social media use</title>
<desc id="d">Two bar charts of VAR coefficients on shopping-app usage by hourly lag. After OTT use the significant coefficients are all positive (hours 1, 2, 6, 7, 10, 11, 12); cumulative response about 0.17. After social media use the coefficients are positive at hours 1, 2, 5, 10, 11, 12 and negative at hours 7, 8, 9; cumulative response about 0.11.</desc>
