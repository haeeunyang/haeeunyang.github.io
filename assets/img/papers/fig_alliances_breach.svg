<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t2 d2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t2">Research model: strategic alliances and data breach risk</title>
<desc id="d2">New non-equity alliances, counted in year t−1, point to hacking breaches, counted in year t, labelled H1 positive. R&amp;D alliance, equal to 1 if any was formed in year t−1, points down to this path, labelled H2 negative.</desc>
<defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker></defs>
<rect width="880" height="330" rx="14" fill="#ffffff"/>
<rect x="300" y="30" width="280" height="96" rx="8" fill="#ffffff" stroke="#111111" stroke-width="1.6"/><text x="440" y="74" text-anchor="middle" font-size="19" font-weight="600" fill="#111111">R&amp;D alliance</text><text x="440" y="98" text-anchor="middle" font-size="14" fill="#555555">1 if any, year t−1</text>
<rect x="30" y="196" width="300" height="96" rx="8" fill="#ffffff" stroke="#111111" stroke-width="1.6"/><text x="180" y="240" text-anchor="middle" font-size="19" font-weight="600" fill="#111111">New non-equity alliances</text><text x="180" y="264" text-anchor="middle" font-size="14" fill="#555555">count, year t−1</text>
<rect x="580" y="196" width="270" height="96" rx="8" fill="#ffffff" stroke="#111111" stroke-width="1.6"/><text x="715" y="240" text-anchor="middle" font-size="19" font-weight="600" fill="#111111">Hacking breaches</text><text x="715" y="264" text-anchor="middle" font-size="14" fill="#555555">count, year t</text>
<line x1="332" y1="244" x2="576" y2="244" stroke="#111111" stroke-width="2.2" marker-end="url(#a2)"/>
<text x="440" y="272" text-anchor="middle" font-size="16" font-weight="600" fill="#111111">H1 (+)</text>
<line x1="440" y1="128" x2="440" y2="237" stroke="#111111" stroke-width="1.8" marker-end="url(#a2)"/>
<text x="451" y="186" text-anchor="start" font-size="16" font-weight="600" fill="#111111">H2 (−)</text>
</svg>
